<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starkzap Stats - npm Download Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0b;
      --bg-secondary: #131316;
      --bg-card: #1a1a1f;
      --border-color: #2a2a32;
      --text-primary: #ffffff;
      --text-secondary: #a0a0a8;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-orange: #f59e0b;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(139, 92, 246, 0.15);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-card.total .stat-value { color: var(--accent-purple); }
    .stat-card.daily .stat-value { color: var(--accent-blue); }
    .stat-card.weekly .stat-value { color: var(--accent-green); }
    .stat-card.monthly .stat-value { color: var(--accent-orange); }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tab {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .tab:hover {
      border-color: var(--accent-purple);
      color: var(--text-primary);
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      border-color: transparent;
      color: white;
    }

    .chart-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .chart-title {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .date-range {
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .chart-wrapper {
      position: relative;
      height: 400px;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid var(--border-color);
      margin-top: 2rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    footer a {
      color: var(--accent-purple);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      color: #ef4444;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 1.75rem;
      }

      .chart-wrapper {
        height: 300px;
      }

      .stat-value {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Starkzap Stats</h1>
      <p class="subtitle">npm download analytics for the Starknet wallet SDK</p>
    </header>

    <div class="stats-grid">
      <div class="stat-card total">
        <div class="stat-value" id="total-downloads">-</div>
        <div class="stat-label">Total Downloads</div>
      </div>
      <div class="stat-card daily">
        <div class="stat-value" id="daily-avg">-</div>
        <div class="stat-label">Daily Average</div>
      </div>
      <div class="stat-card weekly">
        <div class="stat-value" id="weekly-total">-</div>
        <div class="stat-label">This Week</div>
      </div>
      <div class="stat-card monthly">
        <div class="stat-value" id="monthly-total">-</div>
        <div class="stat-label">This Month</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-view="daily">Daily</button>
      <button class="tab" data-view="weekly">Weekly</button>
      <button class="tab" data-view="monthly">Monthly</button>
      <button class="tab" data-view="cumulative">Cumulative</button>
    </div>

    <div class="chart-container">
      <div class="chart-header">
        <h2 class="chart-title" id="chart-title">Daily Downloads</h2>
        <span class="date-range" id="date-range"></span>
      </div>
      <div class="chart-wrapper">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          Loading download data...
        </div>
        <canvas id="chart" style="display: none;"></canvas>
      </div>
    </div>

    <footer>
      <p>
        Data from <a href="https://npmjs.org/package/starkzap" target="_blank" rel="noopener">npm</a> |
        <a href="https://github.com/keep-starknet-strange/starkzap" target="_blank" rel="noopener">GitHub</a>
      </p>
    </footer>
  </div>

  <script>
    const PACKAGE_NAME = 'starkzap';
    const START_DATE = '2025-01-01';

    let allData = [];
    let chart = null;
    let currentView = 'daily';

    // Get today's date in YYYY-MM-DD format
    function getToday() {
      return new Date().toISOString().split('T')[0];
    }

    // Format number with commas
    function formatNumber(num) {
      return num.toLocaleString();
    }

    // Format date for display
    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Get ISO week number
    function getISOWeek(dateStr) {
      const date = new Date(dateStr);
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    // Aggregate data by week
    function aggregateByWeek(data) {
      const weekly = {};
      data.forEach(d => {
        const date = new Date(d.day);
        const year = date.getFullYear();
        const week = getISOWeek(d.day);
        const key = `${year}-W${String(week).padStart(2, '0')}`;

        if (!weekly[key]) {
          weekly[key] = { label: key, downloads: 0, startDay: d.day };
        }
        weekly[key].downloads += d.downloads;
      });

      return Object.values(weekly).sort((a, b) => a.startDay.localeCompare(b.startDay));
    }

    // Aggregate data by month
    function aggregateByMonth(data) {
      const monthly = {};
      data.forEach(d => {
        const key = d.day.substring(0, 7); // YYYY-MM
        if (!monthly[key]) {
          monthly[key] = { label: key, downloads: 0 };
        }
        monthly[key].downloads += d.downloads;
      });

      return Object.values(monthly).sort((a, b) => a.label.localeCompare(b.label));
    }

    // Calculate cumulative downloads
    function calculateCumulative(data) {
      let cumulative = 0;
      return data.map(d => {
        cumulative += d.downloads;
        return { day: d.day, downloads: cumulative };
      });
    }

    // Update stats cards
    function updateStats(data) {
      const total = data.reduce((sum, d) => sum + d.downloads, 0);
      const dailyAvg = Math.round(total / data.length);

      // This week
      const today = new Date();
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - today.getDay());
      const weekStartStr = weekStart.toISOString().split('T')[0];
      const thisWeek = data
        .filter(d => d.day >= weekStartStr)
        .reduce((sum, d) => sum + d.downloads, 0);

      // This month
      const monthStart = today.toISOString().substring(0, 8) + '01';
      const thisMonth = data
        .filter(d => d.day >= monthStart)
        .reduce((sum, d) => sum + d.downloads, 0);

      document.getElementById('total-downloads').textContent = formatNumber(total);
      document.getElementById('daily-avg').textContent = formatNumber(dailyAvg);
      document.getElementById('weekly-total').textContent = formatNumber(thisWeek);
      document.getElementById('monthly-total').textContent = formatNumber(thisMonth);
    }

    // Get chart colors based on view
    function getChartColors(view) {
      const colors = {
        daily: { border: '#3b82f6', bg: 'rgba(59, 130, 246, 0.1)' },
        weekly: { border: '#10b981', bg: 'rgba(16, 185, 129, 0.1)' },
        monthly: { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.1)' },
        cumulative: { border: '#8b5cf6', bg: 'rgba(139, 92, 246, 0.1)' }
      };
      return colors[view] || colors.daily;
    }

    // Render chart
    function renderChart(view) {
      const colors = getChartColors(view);
      let labels, values, title;

      switch (view) {
        case 'daily':
          labels = allData.map(d => formatDate(d.day));
          values = allData.map(d => d.downloads);
          title = 'Daily Downloads';
          break;
        case 'weekly':
          const weekly = aggregateByWeek(allData);
          labels = weekly.map(d => d.label);
          values = weekly.map(d => d.downloads);
          title = 'Weekly Downloads';
          break;
        case 'monthly':
          const monthly = aggregateByMonth(allData);
          labels = monthly.map(d => d.label);
          values = monthly.map(d => d.downloads);
          title = 'Monthly Downloads';
          break;
        case 'cumulative':
          const cumulative = calculateCumulative(allData);
          labels = cumulative.map(d => formatDate(d.day));
          values = cumulative.map(d => d.downloads);
          title = 'Cumulative Downloads';
          break;
      }

      document.getElementById('chart-title').textContent = title;
      document.getElementById('date-range').textContent =
        `${formatDate(allData[0].day)} - ${formatDate(allData[allData.length - 1].day)}`;

      if (chart) {
        chart.destroy();
      }

      const ctx = document.getElementById('chart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Downloads',
            data: values,
            borderColor: colors.border,
            backgroundColor: colors.bg,
            fill: true,
            tension: 0.3,
            pointRadius: view === 'daily' ? 0 : 3,
            pointHoverRadius: 5,
            pointBackgroundColor: colors.border,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            intersect: false,
            mode: 'index'
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: '#1a1a1f',
              borderColor: '#2a2a32',
              borderWidth: 1,
              titleColor: '#fff',
              bodyColor: '#a0a0a8',
              padding: 12,
              displayColors: false,
              callbacks: {
                label: (context) => `Downloads: ${formatNumber(context.raw)}`
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: 'rgba(42, 42, 50, 0.5)',
              },
              ticks: {
                color: '#a0a0a8',
                maxTicksLimit: 12
              }
            },
            y: {
              grid: {
                color: 'rgba(42, 42, 50, 0.5)',
              },
              ticks: {
                color: '#a0a0a8',
                callback: (value) => formatNumber(value)
              },
              beginAtZero: true
            }
          }
        }
      });
    }

    // Fetch npm downloads data
    async function fetchData() {
      const endDate = getToday();
      const url = `https://api.npmjs.org/downloads/range/${START_DATE}:${endDate}/${PACKAGE_NAME}`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Failed to fetch data');

        const data = await response.json();
        allData = data.downloads.filter(d => d.downloads > 0);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('chart').style.display = 'block';

        updateStats(allData);
        renderChart(currentView);

      } catch (error) {
        document.getElementById('loading').innerHTML = `
          <div class="error-message">
            <p>Failed to load download data</p>
            <p style="margin-top: 0.5rem; font-size: 0.875rem;">${error.message}</p>
          </div>
        `;
      }
    }

    // Tab click handlers
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentView = tab.dataset.view;

        if (allData.length > 0) {
          renderChart(currentView);
        }
      });
    });

    // Initialize
    fetchData();
  </script>
</body>
</html>
